AutoName: FDM - Fast Download Manager
Summary: Modern high-performance download manager and media browser
Description: |-
  Fast Download Manager (FDM) is a modern, high-performance Android download manager and media browser built with Jetpack Compose, Material 3, and Kotlin Coroutines.

  Features:
  * Streamlined Downloads Dashboard: Real-time speed & ETA, category filters.
  * Multi-Threaded Engine: Concurrent chunked downloads (1 to 32 connections).
  * Integrated Media Sniffer Browser: In-app browser detecting downloadable media streams.
  * Material 3 & Edge-to-Edge UI: Modern dynamic colors and dark theme.
  * Privacy-focused: Wi-Fi only restriction, no telemetry or ads.

