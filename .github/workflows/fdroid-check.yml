name: F-Droid Build & Metadata Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  check-fdroid-compliance:
    name: Verify F-Droid Build & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Release Build (F-Droid target)
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Fastlane Metadata Structure
        run: |
          test -f fastlane/metadata/android/en-US/title.txt
          test -f fastlane/metadata/android/en-US/short_description.txt
          test -f fastlane/metadata/android/en-US/full_description.txt
          echo "Fastlane metadata structure verified successfully."
