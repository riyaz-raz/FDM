name: Build and release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            source="app/build/outputs/apk/release/app-${arch}-release.apk"
            destination="dist/fdm_${arch}.apk"
            test -f "$source"
            cp "$source" "$destination"
          done

          test -f app/build/outputs/apk/release/app-universal-release.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist/fdm_universal.apk

          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab dist/fdm_release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
